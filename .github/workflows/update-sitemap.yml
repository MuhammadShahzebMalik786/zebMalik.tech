name: Auto-Sync SEO & Static Articles (Sitemap + llms.txt + Pre-render + IndexNow)

on:
  # Triggered instantly by Supabase Database Webhook (post published/deleted)
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'What triggered this run'
        required: false
        default: 'manual'

  # Daily fallback at 02:00 UTC — catches anything missed
  schedule:
    - cron: '0 2 * * *'

  # Also run on manual code pushes to main
  push:
    branches: [main]
    paths-ignore:
      - 'sitemap.xml'
      - 'llms.txt'
      - 'blog.html'
      - 'posts/**'

jobs:
  sync-seo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log trigger source
        run: |
          echo "🔔 Triggered by: ${{ github.event_name }} / ${{ inputs.trigger_source || 'n/a' }}"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pre-render static articles + update sitemap + llms.txt + IndexNow
        run: node scripts/build-static.js

      - name: Commit & push if files changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml llms.txt blog.html cmd-palette.js posts/ scripts/
          if git diff --staged --quiet; then
            echo "✅ All static pages, sitemap.xml and llms.txt are up to date. Nothing to commit."
          else
            git commit -m "chore(seo): auto-build static articles & sync sitemap [${{ github.event_name }}] [skip ci]"
            git push origin main
            echo "🚀 Static articles and SEO assets updated and pushed."
          fi
