name: Auto-Sync SEO (Sitemap + llms.txt + IndexNow)

on:
  # Run daily at 02:00 UTC so new articles appear in search within 24 hours
  schedule:
    - cron: '0 2 * * *'

  # Also run immediately on every push to main
  push:
    branches: [main]

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  sync-seo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so we can commit back cleanly
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate sitemap.xml + llms.txt + ping IndexNow
        run: node scripts/update-sitemap.js

      - name: Commit & push if files changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml llms.txt
          if git diff --staged --quiet; then
            echo "✅ sitemap.xml and llms.txt are already up to date. Nothing to commit."
          else
            ARTICLE_COUNT=$(git diff --staged --name-only | wc -l)
            git commit -m "chore(seo): auto-sync sitemap.xml + llms.txt with latest articles [skip ci]"
            git push origin main
            echo "🚀 Pushed updated SEO files to main."
          fi
