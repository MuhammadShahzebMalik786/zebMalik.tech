name: Auto-Sync SEO (Sitemap + llms.txt + IndexNow)

on:
  # Triggered instantly by Supabase Database Webhook (post published/deleted)
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'What triggered this run'
        required: false
        default: 'manual'

  # Daily fallback at 02:00 UTC — catches anything missed
  schedule:
    - cron: '0 2 * * *'

  # Also run on code pushes to main
  push:
    branches: [main]
    paths-ignore:
      - 'sitemap.xml'
      - 'llms.txt'

jobs:
  sync-seo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log trigger source
        run: |
          echo "🔔 Triggered by: ${{ github.event_name }} / ${{ inputs.trigger_source || 'n/a' }}"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate sitemap.xml + llms.txt + ping IndexNow
        run: node scripts/update-sitemap.js

      - name: Commit & push if files changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml llms.txt
          if git diff --staged --quiet; then
            echo "✅ sitemap.xml and llms.txt already up to date. Nothing to commit."
          else
            git commit -m "chore(seo): auto-sync sitemap + llms.txt [${{ github.event_name }}] [skip ci]"
            git push origin main
            echo "🚀 SEO files updated and pushed."
          fi
